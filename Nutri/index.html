<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NutriTrack X</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>

:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--sub:#94a3b8;
--green:#22c55e;
--blue:#3b82f6;
--orange:#f59e0b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
padding:20px;
}

.container{
max-width:1300px;
margin:auto;
}

h1{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:var(--card);
padding:20px;
border-radius:16px;
}

.kpi{
font-size:2rem;
font-weight:bold;
margin-top:10px;
}

.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

@media(max-width:900px){
.main{
grid-template-columns:1fr;
}
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
background:#111827;
border:none;
border-radius:10px;
color:white;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:var(--blue);
color:white;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.food-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#111827;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.delete{
background:#dc2626;
padding:7px 12px;
}

.progress{
height:12px;
background:#111827;
border-radius:99px;
overflow:hidden;
margin-bottom:18px;
}

.progress-bar{
height:100%;
background:var(--green);
width:0%;
transition:.3s;
}

canvas{
max-height:340px;
}

</style>
</head>
<body>

<div class="container">

<h1>💪 NutriTrack X</h1>

<div class="grid">

<div class="card">
<div>🔥 Calorías</div>
<div class="kpi" id="kcal">0</div>
</div>

<div class="card">
<div>🥩 Proteína</div>
<div class="kpi" id="proteinTotal">0 g</div>
</div>

<div class="card">
<div>🍚 Carbohidratos</div>
<div class="kpi" id="carbsTotal">0 g</div>
</div>

<div class="card">
<div>🥑 Grasas</div>
<div class="kpi" id="fatTotal">0 g</div>
</div>

</div>

<div class="main">

<div class="card">

<h2>Agregar alimento</h2>
<br>

<form id="foodForm">

<input id="name" placeholder="Nombre alimento" required>

<input id="protein" type="number" min="0" step="0.1" placeholder="Proteínas">

<input id="carbs" type="number" min="0" step="0.1" placeholder="Carbohidratos">

<input id="fat" type="number" min="0" step="0.1" placeholder="Grasas">

<input id="calories" type="number" min="0" step="0.1" placeholder="Calorías">

<button type="submit">
Agregar
</button>

</form>

<div id="foodList"></div>

</div>

<div>

<div class="card">

<h2>Metas</h2>
<br>

Proteína (90g)
<div class="progress">
<div id="proteinBar" class="progress-bar"></div>
</div>

Carbohidratos (300g)
<div class="progress">
<div id="carbsBar" class="progress-bar"></div>
</div>

Grasas (65g)
<div class="progress">
<div id="fatBar" class="progress-bar"></div>
</div>

Calorías (2400)
<div class="progress">
<div id="kcalBar" class="progress-bar"></div>
</div>

</div>

<br>

<div class="card">

<h2>Distribución</h2>

<canvas id="chart"></canvas>

</div>

</div>

</div>

</div>

<script>

let foods =
JSON.parse(localStorage.getItem("foods")) || [];

const chart = new Chart(
document.getElementById("chart"),
{
type:"doughnut",
data:{
labels:[
"Proteína",
"Carbohidratos",
"Grasas"
],
datasets:[
{
data:[0,0,0],
backgroundColor:[
"#22c55e",
"#3b82f6",
"#f59e0b"
]
}
]
}
}
);

document
.getElementById("foodForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

foods.push({

name:
document.getElementById("name").value,

protein:
parseFloat(
document.getElementById("protein").value
) || 0,

carbs:
parseFloat(
document.getElementById("carbs").value
) || 0,

fat:
parseFloat(
document.getElementById("fat").value
) || 0,

calories:
parseFloat(
document.getElementById("calories").value
) || 0

});

save();
render();
this.reset();

}
);

function save(){

localStorage.setItem(
"foods",
JSON.stringify(foods)
);

}

function removeFood(index){

foods.splice(index,1);

save();
render();

}

function render(){

let protein=0;
let carbs=0;
let fat=0;
let calories=0;

foods.forEach(food=>{

protein += Number(food.protein) || 0;
carbs += Number(food.carbs) || 0;
fat += Number(food.fat) || 0;
calories += Number(food.calories) || 0;

});

document.getElementById(
"proteinTotal"
).textContent =
protein.toFixed(1)+" g";

document.getElementById(
"carbsTotal"
).textContent =
carbs.toFixed(1)+" g";

document.getElementById(
"fatTotal"
).textContent =
fat.toFixed(1)+" g";

document.getElementById(
"kcal"
).textContent =
calories.toFixed(0);

document.getElementById(
"proteinBar"
).style.width =
Math.min((protein/90)*100,100)+"%";

document.getElementById(
"carbsBar"
).style.width =
Math.min((carbs/300)*100,100)+"%";

document.getElementById(
"fatBar"
).style.width =
Math.min((fat/65)*100,100)+"%";

document.getElementById(
"kcalBar"
).style.width =
Math.min((calories/2400)*100,100)+"%";

chart.data.datasets[0].data = [
protein,
carbs,
fat
];

chart.update();

const foodList =
document.getElementById(
"foodList"
);

foodList.innerHTML="";

foods.forEach((food,index)=>{

foodList.innerHTML += `

<div class="food-item">

<div>

<strong>${food.name}</strong>

<br>

P:${food.protein}
C:${food.carbs}
G:${food.fat}
K:${food.calories}

</div>

<button
class="delete"
onclick="removeFood(${index})">

Eliminar

</button>

</div>

`;

});

}

render();

</script>

</body>
</html>
