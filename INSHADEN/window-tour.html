<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INSHADEN Window Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f1ec;--mut:#c9c3b8;--bg:#17191c;--glass:rgba(23,25,28,.72);--line:rgba(244,241,236,.22);--sun:#f2b84b;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#view{position:fixed;inset:0;touch-action:none;cursor:grab}#view:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.top{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
h1{font-size:1.05rem;font-weight:700;letter-spacing:.01em}
.hint{font-size:.82rem;color:var(--mut);background:var(--glass);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.box{pointer-events:auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.lab{font-size:.78rem;color:var(--mut);margin:0 2px 6px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ink)}button[aria-pressed=true]{background:var(--ink);color:#17191c;border-color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.ctl{display:grid;gap:8px;min-width:270px}.row{display:flex;gap:6px;align-items:center}
input[type=range]{flex:1;accent-color:var(--sun);min-width:80px}
.hs{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #fff;background:rgba(23,25,28,.45);display:grid;place-items:center;padding:0;font-size:1.2rem;animation:pulse 2.2s infinite;will-change:transform}
.hs span{position:absolute;top:52px;white-space:nowrap;font-size:.8rem;background:var(--glass);padding:3px 9px;border-radius:7px;opacity:0;transition:opacity .15s;pointer-events:none}
.hs:hover span,.hs:focus-visible span{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){.hs{animation:none}}
@media(max-width:640px){.hint{display:none}.ctl{min-width:0;width:100%}.dock>.box{width:100%}}
</style></head><body>
<div id="view" aria-label="360 degree room view. Drag to look around."></div>
<div class="top"><h1>Smart Window Tour</h1><div class="hint">Drag to look around · scroll to zoom</div></div>
<div class="dock">
 <div class="box"><p class="lab">Home</p><div class="seg" id="homes"></div><p class="lab" style="margin-top:8px">Room</p><div class="seg" id="rooms"></div></div>
 <div class="box ctl"><p class="lab" style="margin:0">Style in this room</p>
  <div class="seg" id="types"></div>
  <div class="row"><button id="bClose">Close</button><input id="sl" type="range" min="0" max="100" value="0" aria-label="Open amount"><button id="bOpen">Open</button></div>
  <button id="auto" aria-pressed="false">Auto demo</button></div>
</div>
