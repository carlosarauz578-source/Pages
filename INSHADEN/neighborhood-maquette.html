<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e7e6dc"><title>INSHADEN Residential Miniature</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e6dc;font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;min-height:390px;background:radial-gradient(ellipse at 50% 34%,#fbfaf4,#dfe5db 72%,#d2dbd0)}canvas{display:block;width:100%;height:100%;outline:0}.label{position:absolute;left:22px;top:20px;color:#455244;font-size:9px;letter-spacing:.2em;font-weight:700;text-shadow:0 1px 8px #fff9}.caption{position:absolute;left:22px;bottom:20px;color:#455244;font-size:9px;letter-spacing:.15em;display:flex;gap:16px;align-items:center}.caption b{font:20px Georgia,serif;letter-spacing:0;font-weight:400}.caption span{opacity:.7}.legend{position:absolute;right:20px;top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.legend span{background:#f7f5edc9;padding:7px 9px;color:#53604f;font-size:8px;letter-spacing:.08em;border:1px solid #ffffffa8;backdrop-filter:blur(6px)}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:#52604f;font:18px Georgia,serif;padding:30px;text-align:center}
@media(max-width:560px){.label{left:14px;top:14px;font-size:8px}.caption{left:14px;bottom:14px;display:block}.caption b{display:block;font-size:17px;margin-bottom:5px}.caption span{font-size:7px}.legend{right:12px;top:42px;max-width:155px}.legend span{font-size:7px;padding:6px}}
@media(prefers-reduced-motion:reduce){.label:after{content:" · MOTION REDUCED"}}
</style></head><body><main class="scene"><div class="label">INSHADEN · RESIDENTIAL DESIGN AT A GLANCE</div><div class="legend"><span>CURTAINS</span><span>BLINDS</span><span>BARE WINDOWS</span><span>NEW BUILD</span></div><div class="caption"><b>A neighborhood of possibilities.</b><span>HOMES · APARTMENTS · RENOVATION · NEW BUILD</span></div><div id="fallback" class="fallback">A miniature residential neighborhood, with different window styles and treatments.</div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const root=document.querySelector('.scene'),fallback=document.getElementById('fallback');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#e5e9df');scene.fog=new THREE.Fog('#e5e9df',29,57);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(17,13,22);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;root.appendChild(renderer.domElement);fallback.remove();
scene.add(new THREE.HemisphereLight('#fff8e9','#87927f',2.05));
const sun=new THREE.DirectionalLight('#fff0d5',3.1);sun.position.set(-9,17,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat('#aab49a'),plinth=mat('#d4d0c1'),road=mat('#777d75'),walk=mat('#c9c5b7'),white=mat('#eee9dc'),brick=mat('#b9a48b'),sage=mat('#aab3a0'),dark=mat('#5d695e'),roof=mat('#626a60'),glass=new THREE.MeshPhysicalMaterial({color:'#7c9b9c',roughness:.19,metalness:.12,transparent:true,opacity:.68});
function box(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const district=new THREE.Group();scene.add(district);
box(district,34,.65,25,0,-.5,0,plinth);box(district,32,.12,23,0,-.1,0,grass);
box(district,33,.08,5,0,-.015,3.3,road);box(district,33,.09,1.1,0,.01,6.35,walk);
for(let x=-15;x<16;x+=3.2){box(district,.08,.015,.13,x,.04,3.3,mat('#e7e0c8'))}
function windowUnit(parent,x,y,z,w,h,kind,side=false){
 const frame=mat('#eee9dc'),trim=mat('#e7e1d4'),g=box(parent,w,h,.09,x,y,z,glass);box(parent,w+.12,.09,.13,x,y+h/2,z,trim);box(parent,w+.12,.09,.13,x,y-h/2,z,trim);box(parent,.07,h,.13,x-w/2,y,z,trim);box(parent,.07,h,.13,x+w/2,y,z,trim);
 if(kind==='curtain'){const fabric=mat('#d6c8b0');box(parent,w*.24,h*.92,.055,x-w*.34,y,z+.075,fabric);box(parent,w*.24,h*.92,.055,x+w*.34,y,z+.075,fabric);box(parent,w*.84,.045,.08,x,y+h*.52,z+.07,mat('#82765f'))}
 if(kind==='blind'){const slat=mat('#eee7d9');for(let k=0;k<7;k++)box(parent,w*.9,.035,.065,x,y-h*.34+k*h*.105,z+.09,slat)}
 if(kind==='blackout'){box(parent,w*.88,h*.88,.06,x,y,z+.08,mat('#a5a18f'))}
}
function makeBuilding(x,z,w,levels,style,seed,unfinished=false){
 const group=new THREE.Group();group.position.set(x,0,z);district.add(group);
 const colors=[white,brick,sage,mat('#d0c3ae')],body=colors[style%colors.length],floorH=1.48,total=levels*floorH;
 box(group,w,total,w*.68,0,total/2,0,body);
 box(group,w+.24,.22,w*.72,0,total+.08,0,roof);
 if(levels<=2){const r=box(group,w+.3,.16,w*.8,0,total+.2,0,roof);r.rotation.z=0}
 const columns=Math.max(2,Math.floor(w/1.15));
 for(let lev=0;lev<levels;lev++){
  const yy=.42+lev*floorH;
  for(let col=0;col<columns;col++){
   const xx=-w/2+(col+.5)*w/columns,ww=Math.min(.78,w/columns*.64),hh=.88;
   let treatment=(col+lev+seed)%5===0?'curtain':(col*2+lev+seed)%5===1?'blind':(col+lev)%7===0?'blackout':'bare';
   windowUnit(group,xx,yy,w*.34+0.05,ww,hh,treatment);
   if(levels>2&&col%2===0){box(group,ww+.16,.055,.34,xx,yy-.51,w*.34+.22,mat('#d6d0c3'));box(group,.055,.32,.055,xx-ww/2,yy-.34,w*.34+.32,dark);box(group,.055,.32,.055,xx+ww/2,yy-.34,w*.34+.32,dark)}
  }
 }
 // Side elevation windows, to sell the miniature architectural perspective.
 for(let lev=0;lev<levels;lev++)for(let c=0;c<2;c++){const yy=.42+lev*floorH,zz=-w*.2+c*w*.34;windowUnit(group,w/2+.055,yy,zz,.58,.82,(lev+c+seed)%3===0?'blind':'bare')}
 if(unfinished){
  const pole=mat('#b88755');for(let px=-w/2-.18;px<=w/2+.2;px+=.72){box(group,.045,total+.5,.045,px,(total+.5)/2,w*.39,pole);box(group,.045,total+.5,.045,px,(total+.5)/2,-w*.39,pole)}
  for(let yy=.5;yy<total+.4;yy+=.72)box(group,w+.5,.045,.045,0,yy,w*.39,pole);
  box(group,w*.72,.08,w*.5,0,total+.38,0,mat('#a5a99a'));
 }
 // Entry, steps, garden beds.
 box(group,.72,1.25,.12,-w*.25,.63,w*.345,mat('#625f54'));
 box(group,1.1,.12,.5,-w*.25,.08,w*.45,walk);
 return group;
}
makeBuilding(-11,-5,4.3,2,0,1);makeBuilding(-5.7,-5.2,3.5,3,2,2);makeBuilding(0,-5.5,5.1,5,1,3);makeBuilding(7,-5.3,4.1,4,3,4,true);makeBuilding(12,-5.2,3.5,2,2,5);
makeBuilding(-10,2,3.8,2,2,6);makeBuilding(-4.6,1.9,4.5,3,0,7);makeBuilding(2,1.7,5.3,4,1,8);makeBuilding(9,1.8,4.1,2,3,9);
function tree(x,z,s=1){const trunk=mat('#786b58'),leaf=mat('#788b70');box(district,.22*s,1.1*s,.22*s,x,.55*s,z,trunk);for(let i=0;i<3;i++){const o=new THREE.Mesh(new THREE.IcosahedronGeometry(.72*s-i*.1,1),leaf);o.position.set(x,.95*s+i*.52*s,z);o.castShadow=true;district.add(o)}}
for(const [x,z,s] of [[-15,-2,1],[-8,-1,.8],[-1,-1,.7],[5,-1,.9],[14,-1,1],[-14,8,.9],[-6,8,.7],[4,8,.8],[13,8,.9]])tree(x,z,s);
for(let i=0;i<7;i++)box(district,.42,.32,.5,-14+i*4.4,.16,8.8,mat('#b8a68c'));
const target=new THREE.Vector3(0,3.2,0);let last=0,paused=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('visibilitychange',()=>paused=document.hidden);
function resize(){const w=root.clientWidth,h=root.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(root);resize();
function animate(t){requestAnimationFrame(animate);if(paused)return;const sec=t*.00012;if(!reduce){camera.position.set(Math.cos(sec)*22,12.1+Math.sin(t*.00035)*.45,Math.sin(sec)*22);camera.lookAt(target);sun.position.x=-9+Math.sin(t*.00008)*4;}renderer.render(scene,camera)}requestAnimationFrame(animate);
}catch(e){fallback.textContent='A residential miniature with homes, apartment buildings and different window-treatment styles.';console.error(e)}
</script></body></html>
