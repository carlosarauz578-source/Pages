<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c9d1d0"><title>INSHADEN — Architectural Scene</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c9d1d0}canvas{display:block;width:100%;height:100%}</style></head><body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd5d7');scene.fog=new THREE.Fog('#cbd5d7',28,75);
const camera=new THREE.PerspectiveCamera(38,1,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#edf4f4','#777b72',1.8));const sun=new THREE.DirectionalLight('#fff0d8',3.1);sun.position.set(-12,22,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=mat('#b9b9ae'),edge=mat('#85877f'),steel=mat('#a87542',.45,.65),dark=mat('#343d3a'),glass=new THREE.MeshPhysicalMaterial({color:'#91aeb1',roughness:.16,metalness:.15,transparent:true,opacity:.32});
function box(p,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
const ground=box(scene,100,.3,100,0,-.2,0,mat('#8c9788')); 
const site=new THREE.Group();scene.add(site);
for(let f=0;f<5;f++){let y=f*2.65;box(site,14,.32,9,0,y,0,concrete);for(let x of [-6.7,0,6.7])for(let z of [-4.2,4.2])box(site,.34,2.65,.34,x,y+1.32,z,concrete);for(let x of [-6.7,6.7])box(site,.28,2.65,8.5,x,y+1.32,0,concrete);for(let z of [-4.2,4.2])box(site,13.5,2.65,.28,0,y+1.32,z,concrete);
 for(let x=-5.2;x<=5.2;x+=2.6){box(site,.10,1.9,.10,x,y+1.25,4.42,edge);box(site,.10,1.9,.10,x,y+1.25,-4.42,edge)}
}
for(let x=-7;x<=7;x+=1.4){box(site,.07,14,.07,x,6.7,4.8,steel);box(site,.07,14,.07,x,6.7,-4.8,steel)}
for(let y=1;y<14;y+=1.7){box(site,14.3,.07,.07,0,y,4.8,steel);box(site,14.3,.07,.07,0,y,-4.8,steel)}
// Exposed rebar, temporary stair core and stacks of materials.
for(let i=0;i<16;i++){const x=-6.4+(i%8)*1.8,z=-3.8+Math.floor(i/8)*.6;box(site,.035,1.3,.035,x,13.4,z,steel)}
box(site,2.1,13.1,2.1,-4.5,6.5,-1.8,edge);
for(let i=0;i<5;i++)box(site,2.2,.22,1.3,8+i*.12,.14+i*.24,2.5,mat('#9b8b72'));
const crane=new THREE.Group();scene.add(crane);box(crane,.28,19,.28,10,9.5,-2,steel);box(crane,8,.22,.22,6,18.7,-2,steel);box(crane,3,.16,.18,12,18.4,-2,steel);box(crane,.12,3,.12,3,17.2,-2,steel);box(crane,.08,3,.08,10,17.2,-2,steel);box(crane,.08,5,.08,7,16.1,-2,steel);
for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.2,1.1),mat('#a99a7e'));b.position.set(-10+i*2,.2,-6);scene.add(b)}
// Distant low-rise silhouettes and trees.
for(let i=0;i<14;i++){let h=3+(i%5)*1.3;box(scene,2.6,h,2.5,-23+i*3.5,h/2,-18,mat(i%2?'#aeb8b4':'#9ba9a4'))}
const key=[{t:0,p:[19,17,27],look:[0,6,0]},{t:2.6,p:[12,11,19],look:[0,6,0]},{t:5.2,p:[7,8,13],look:[0,7,0]}];
function pose(t){let q=Math.min(1,t/5.2),s=q*q*(3-2*q),a=key[0],b=key[2];camera.position.set(a.p[0]+(b.p[0]-a.p[0])*s,a.p[1]+(b.p[1]-a.p[1])*s,a.p[2]+(b.p[2]-a.p[2])*s);camera.lookAt(0,6.2,0)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let start=performance.now();
function animate(now){requestAnimationFrame(animate);let t=((now-start)/1000)%7.2;if(!reduced)pose(t>5.2?5.2:t);renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
