name: Deploy INSHADEN and project pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare published site
        run: |
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./INSHADEN/INSHADEN-deploy-ready.zip' -cf - . | tar -xf - -C _site
          test -f INSHADEN/INSHADEN-deploy-ready.zip
          unzip -q INSHADEN/INSHADEN-deploy-ready.zip -d /tmp/inshaden-release
          test -d /tmp/inshaden-release/INSHADEN
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/inshaden-release/INSHADEN")
          page = root / "index.html"
          html = page.read_text(encoding="utf-8")
          old_video = '<video id="v" src="assets/video/inshaden-hero-scrub.mp4" muted playsinline preload="auto"'
          new_video = '<video id="v" src="assets/video/inshaden-hero-scrub.mp4" autoplay muted loop playsinline preload="auto"'
          if old_video not in html:
              raise SystemExit("Expected hero video element was not found; refusing to publish an unpatched package.")
          html = html.replace(old_video, new_video, 1)
          html = html.replace(
              "Scroll to move the shade — down to lower it, up to raise it, stop to hold it right where you like.",
              "See how light and privacy move together in a beautifully designed space.",
              1,
          )
          html_replacements = [
              (
                  'More categories</h2><p class="lead" style="margin-bottom:24px">Different mechanism, different guide: motorized curtains and tracks move sideways, not up and down.</p>',
                  'Explore more solutions</h2><p class="lead" style="margin-bottom:24px">Discover curtain and blind styles, motorized systems and smart controls already offered by selected manufacturers. Product availability and compatibility vary by brand.</p>',
              ),
              (
                  "Short clips of smart shades at work: remote and voice control, natural woven fabrics, skylights and full blackout.",
                  "Manufacturer demonstrations of voice control, smart operation, styles, fabrics and finishes.",
              ),
              (
                  "Windows come in every shape. Many shades can follow angles, slopes and overhead glass, depending on the supplier.",
                  "Explore solutions for skylights, angled windows and other spaces beyond the standard rectangle. Available configurations depend on the manufacturer.",
              ),
          ]
          for old_text, new_text in html_replacements:
              if old_text not in html:
                  raise SystemExit(f"Expected section copy was not found: {old_text[:70]}")
              html = html.replace(old_text, new_text, 1)
          verification_tag = "<meta name='impact-site-verification' value='61e75f7f-15d6-454a-ae79-3657132fd1d0'>"
          if "name='impact-site-verification'" not in html and 'name="impact-site-verification"' not in html:
              if "</head>" not in html:
                  raise SystemExit("HTML head closing tag was not found; refusing to publish without the verification tag.")
              html = html.replace("</head>", f"  {verification_tag}\n</head>", 1)
          page.write_text(html, encoding="utf-8")

          js_path = root / "js" / "main.js"
          js = js_path.read_text(encoding="utf-8")
          old_tick = 'if(v.duration){cur+=(tg-cur)*.18;if(Math.abs(tg-cur)<.0005)cur=tg;v.currentTime=cur*(v.duration-.05)}'
          if old_tick not in js:
              raise SystemExit("Expected scroll-scrub playback code was not found; refusing to publish an unpatched package.")
          js = js.replace(old_tick, "", 1)

          old_soon = '''$("#soon").innerHTML=`<article class="card soon"><div class="cb"><span class="tag">Explore by request</span><h3>Vertical blinds</h3><p>Looking for a vertical solution? Ask INSHADEN and we can help you explore options.</p><a class="btn p" href="${contactUrl("vertical blinds")}" target="_blank" rel="noopener noreferrer">Ask about vertical blinds</a></div></article>`+[["Motorized curtains & tracks","Moves sideways"],["Smart hubs & remotes","Control"],["Accessories & samples","Finishing touches"]].map(c=>`<article class="card soon"><div class="cb"><span class="tag">${c[1]}</span><h3>${c[0]}</h3><p>Coming soon.</p></div></article>`).join("");'''
          new_soon = '''$("#soon").innerHTML=[["Vertical blinds","Explore by request","vertical blinds"],["Motorized curtains & tracks","Motorized options","motorized curtains and tracks"],["Voice & smart controls","Compatible smart systems","voice control and smart shades"],["Styles, fabrics & combinations","Find your look","curtain and blind styles, fabrics and combinations"]].map(c=>`<article class="card soon"><div class="cb"><span class="tag">${c[1]}</span><h3>${c[0]}</h3><p>These options are already available from selected manufacturers. Ask us about product availability and compatibility.</p><a class="btn p" href="${contactUrl(c[2])}" target="_blank" rel="noopener noreferrer">Explore this option</a></div></article>`).join("");'''
          if old_soon not in js:
              raise SystemExit("Expected upcoming-solutions block was not found.")
          js = js.replace(old_soon, new_soon, 1)

          old_videos = '''$("#vids").innerHTML=[["voice","Smart control, your way","Remote and voice-assistant control, as shown in a supplier demo."],["woven","Woven & Roman shades","Natural textures, fabric samples and remote control."],["sky","Skylight shades","A shade that follows the slope of a roof window."],["dark","Blackout in action","A room going dark as the shade closes."]].map(d=>`<figure class="vid"><video data-s="${MV[d[0]]}" muted loop playsinline preload="none" aria-label="${d[1]}"></video><figcaption><b>${d[1]}</b><span>${d[2]}</span></figcaption></figure>`).join("");'''
          new_videos = '''$("#vids").innerHTML=[["voice","Voice & smart control","See how compatible shades can respond to voice assistants and smart controls."],["woven","Styles, fabrics & combinations","A manufacturer showcase of different curtain and blind looks, fabrics, combinations and control options."]].map(d=>`<figure class="vid"><video data-s="${MV[d[0]]}" muted loop playsinline preload="none" aria-label="${d[1]}"></video><figcaption><b>${d[1]}</b><span>${d[2]}</span></figcaption></figure>`).join("");'''
          if old_videos not in js:
              raise SystemExit("Expected demonstration video block was not found.")
          js = js.replace(old_videos, new_videos, 1)

          old_shapes = '''$("#shp").innerHTML=[["gable","Gable & triangle windows","Cellular shades can be made to follow angled and sloped windows. Availability depends on the supplier, so check each listing.","Cellular shades fitted to triangular and sloped windows"],["roof","Skylights & glass roofs","Shades can run overhead beneath a glass roof or skylight. Check the supplier for compatible products.","Cellular shades under an overhead glass roof"]].map(d=>`<article class="card shp"><img src="${MI[d[0]]}" alt="${d[3]}" loading="lazy"><div class="cb"><span class="tag">Special shapes</span><h3>${d[1]}</h3><p>${d[2]}</p></div></article>`).join("");'''
          new_shapes = '''$("#shp").innerHTML=[["gable","Gable & triangle windows","Explore shade options designed for angled and triangular windows. Confirm measurements and availability with the manufacturer.","Cellular shades fitted to triangular and sloped windows"],["roof","Skylights & glass roofs","Explore compatible solutions for skylights and overhead glazing. Product fit depends on the window system and supplier.","Cellular shades under an overhead glass roof"]].map(d=>`<article class="card shp"><img src="${MI[d[0]]}" alt="${d[3]}" loading="lazy"><div class="cb"><span class="tag">Special applications</span><h3>${d[1]}</h3><p>${d[2]}</p></div></article>`).join("")+[["sky","Skylight shade in action","A closer look at a shade application for roof windows."],["dark","Light & privacy control","See how a shade changes the light and privacy in a room."]].map(d=>`<figure class="vid"><video data-s="${MV[d[0]]}" muted loop playsinline preload="none" aria-label="${d[1]}"></video><figcaption><b>${d[1]}</b><span>${d[2]}</span></figcaption></figure>`).join("");'''
          if old_shapes not in js:
              raise SystemExit("Expected Beyond the Rectangle block was not found.")
          js = js.replace(old_shapes, new_shapes, 1)
          old_card_video = '<video data-s="${MV[d[0]]}" muted loop playsinline preload="none"'
          new_card_video = '<video data-s="${MV[d[0]]}" autoplay muted loop playsinline preload="none"'
          if old_card_video not in js:
              raise SystemExit("Expected inspiration video template was not found.")
          js = js.replace(old_card_video, new_card_video, 1)
          old_listener = 'v.addEventListener("loadedmetadata",()=>{v.pause();tick()});tick();'
          if old_listener not in js:
              raise SystemExit("Expected hero video pause listener was not found.")
          js = js.replace(old_listener, 'v.play().catch(()=>{});v.addEventListener("loadedmetadata",tick);tick();', 1)
          js_path.write_text(js, encoding="utf-8")
          PY
          rm -rf _site/INSHADEN
          cp -a /tmp/inshaden-release/INSHADEN/. _site/
          printf 'inshaden.com\n' > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
